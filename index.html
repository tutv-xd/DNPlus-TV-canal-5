<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal 5 DNPlus TV • Espectadores</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- HLS.js para reproducción .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- MQTT.js para sincronización en tiempo real -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f8fafc;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #tvMonitorBox.tv-expanded-fs {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            aspect-ratio: auto !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 9999 !important;
            background-color: #000000 !important;
        }
        #tvMonitorBox:fullscreen,
        #tvMonitorBox:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
            background-color: #000000 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#030712] text-slate-100 overflow-x-hidden selection:bg-sky-500 selection:text-white">

    <!-- Cabecera -->
    <header class="sticky top-0 z-30 bg-[#07122b]/95 backdrop-blur-md border-b border-blue-900/70">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-white/10 border border-white/15 p-1 flex items-center justify-center shrink-0">
                    <img
                        src="https://i.postimg.cc/LXRZWmVc/Picsart-26-11-16-18-48-31-391.jpg"
                        alt="Logo Canal 5 DNPlus TV"
                        onerror="this.onerror=null;this.src='https://placehold.co/80x80/0f172a/38bdf8?text=DN5';"
                        class="w-full h-full object-contain rounded-lg"
                    >
                </div>
                <div class="min-w-0">
                    <h1 class="text-sm sm:text-lg font-black text-white truncate">
                        Canal 5 <span class="text-sky-400">DNPlus TV</span>
                    </h1>
                    <p id="syncStatusText" class="text-[11px] text-emerald-400 font-semibold truncate">
                        Señal Digital en Vivo • 24/7
                    </p>
                </div>
            </div>

            <a
                href="https://wa.me/595992536184?text=Hola%20Canal%205%20DNPlus%20TV,%20los%20estoy%20viendo%20en%20vivo!"
                target="_blank"
                rel="noopener noreferrer"
                class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shrink-0 transition"
            >
                <i class="fa-brands fa-whatsapp text-sm"></i>
                <span>WhatsApp</span>
            </a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-3 flex flex-col gap-3">

        <!-- Monitor TV Estático (Fijo arriba al deslizar canales) -->
        <section id="tvMonitorBox" class="sticky top-[57px] z-20 relative w-full aspect-video bg-black rounded-3xl overflow-hidden border border-sky-500/40 shadow-[0_14px_35px_rgba(0,0,0,0.9)] flex items-center justify-center">
            <div class="absolute top-3 left-3 z-20 flex flex-wrap items-center gap-1.5 bg-slate-950/85 px-2.5 py-1 rounded-xl border border-white/10 pointer-events-none">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                <span class="text-[11px] font-black text-white uppercase">DNPLUS TV</span>
                <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400">ALTA</span>
                <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300">SEÑAL 1</span>
            </div>

            <div id="statusOverlay" class="hidden absolute inset-x-4 top-14 z-30 bg-slate-950/90 border border-sky-500/40 text-sky-200 px-3.5 py-2 rounded-2xl text-xs font-bold text-center shadow-lg">
                <span id="statusOverlayText">Sincronizando señal...</span>
            </div>

            <video
                id="viewerVideo"
                class="w-full h-full object-contain bg-black"
                autoplay
                playsinline
                controlsList="nodownload noplaybackrate"
            ></video>

            <button
                type="button"
                id="btnTapForAudio"
                onclick="enableAudioNow()"
                class="hidden absolute top-14 left-3 z-20 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-xl text-[11px] flex items-center gap-1.5 shadow-lg transition cursor-pointer"
            >
                <i class="fa-solid fa-volume-high"></i>
                <span>Toca para activar audio</span>
            </button>

            <div class="absolute bottom-3 right-3 z-20 flex items-center gap-2">
                <button
                    type="button"
                    id="btnToggleMute"
                    onclick="toggleMute()"
                    aria-label="Activar o silenciar audio"
                    class="w-10 h-10 rounded-2xl bg-slate-950/85 hover:bg-slate-900 text-white border border-white/15 flex items-center justify-center shadow-lg transition cursor-pointer"
                >
                    <i id="muteIcon" class="fa-solid fa-volume-xmark text-white text-sm"></i>
                </button>

                <button
                    type="button"
                    id="btnTvFull"
                    onclick="toggleTvFullscreen()"
                    aria-label="Pantalla Completa TV"
                    class="h-10 px-3 rounded-2xl bg-slate-950/85 hover:bg-sky-600 text-white border border-white/15 flex items-center justify-center gap-1.5 shadow-lg transition cursor-pointer"
                >
                    <i id="fsIcon" class="fa-solid fa-expand text-white text-sm"></i>
                    <span id="fsLabel" class="text-[11px] font-black uppercase">TV</span>
                </button>
            </div>
        </section>

        <!-- Barra de Canal Actual -->
        <section class="bg-[#0a1329] border border-blue-900/70 rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-lg">
            <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 mb-0.5">
                    <span class="px-2 py-0.5 rounded bg-red-600 text-white text-[10px] font-black uppercase">EN VIVO 24/7</span>
                    <span id="channelCounterText" class="text-[11px] font-mono text-slate-400">0 / 0</span>
                </div>
                <h2 id="currentChannelTitle" class="text-sm sm:text-base font-black text-white truncate">
                    Esperando señal del canal...
                </h2>
            </div>

            <div class="flex flex-wrap items-center gap-2 shrink-0">
                <button
                    type="button"
                    id="btnRefreshViewers"
                    onclick="refreshChannelsFromPanel()"
                    class="bg-sky-600 hover:bg-sky-500 text-white font-extrabold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 transition cursor-pointer shadow"
                >
                    <i id="refreshIcon" class="fa-solid fa-arrows-rotate"></i>
                    <span>Refrescar</span>
                </button>
                <button
                    type="button"
                    onclick="enableAudioNow()"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 transition cursor-pointer"
                >
                    <i class="fa-solid fa-volume-high"></i>
                    <span>Audio</span>
                </button>
                <button
                    type="button"
                    onclick="playNextChannel(true)"
        <!-- Íconos de Canales Deslizables (Solo TV EN VIVO y PELÍCULAS Y SERIES) -->
        <section id="viewerChannelsBar" class="bg-[#0a1329] border border-blue-800/60 rounded-2xl p-3.5 flex flex-col gap-2.5 shadow-lg">
            <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-extrabold text-sky-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-tv"></i> Desliza y toca un canal
                </span>
                <div class="flex items-center gap-1.5">
                    <span id="quickChannelsCount" class="text-[11px] font-mono text-slate-400 mr-1">0 canales</span>
                    <button type="button" onclick="scrollChannelsStrip(-1)" aria-label="Deslizar izquierda" class="w-7 h-7 rounded-lg bg-slate-900 hover:bg-sky-600 text-slate-200 hover:text-white border border-slate-700 text-xs flex items-center justify-center cursor-pointer transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button type="button" onclick="scrollChannelsStrip(1)" aria-label="Deslizar derecha" class="w-7 h-7 rounded-lg bg-slate-900 hover:bg-sky-600 text-slate-200 hover:text-white border border-slate-700 text-xs flex items-center justify-center cursor-pointer transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="setChannelFilter('tv')" id="filter-tv" class="py-2 px-3 rounded-xl bg-sky-600 text-white text-xs font-black flex items-center justify-center gap-1.5 cursor-pointer transition shadow">
                    <i class="fa-solid fa-tv"></i>
                    <span>TV EN VIVO</span>
                </button>
                <button type="button" onclick="setChannelFilter('peliculas')" id="filter-peliculas" class="py-2 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-extrabold flex items-center justify-center gap-1.5 cursor-pointer transition">
                    <i class="fa-solid fa-film"></i>
                    <span>PELÍCULAS Y SERIES</span>
                </button>
            </div>

            <div id="viewerChannelIconsGrid" class="flex gap-2.5 overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar py-1"></div>
        </section>

    </main>

    <!-- Pie de Página -->
    <footer class="bg-[#07122b] border-t border-blue-950 py-3 text-center text-xs text-slate-400">
        &copy; 2026 Canal 5 DNPlus TV • Emisión Continua 24/7
    </footer>

    <script>
        const VIEWER_STORAGE_KEY = 'dnplus_viewer_saved_channels_v2';
        const MQTT_BROKERS = [
            'wss://broker.emqx.io:8084/mqtt',
            'wss://broker.hivemq.com:8884/mqtt',
            'wss://test.mosquitto.org:8081/mqtt'
        ];
        const MQTT_TOPICS = [
            'dnplus/canal5/live',
            'dnplus/canal5/playlist',
            'dnplus/canal5/DNPLUS-CANAL5-OFICIAL',
            'canal5-dnplus-senal-vivo'
        ];

        let channels = [];
        let currentIdx = 0;
        let currentFilter = 'tv';
        let currentStreamUrl = '';
        let lastAppliedSignalTimestamp = 0;
        let clearedAtTimestamp = 0;
        let hlsInstance = null;
        let noticeTimeout = null;
        let isCssFull = false;
        const activeMqttClients = [];
        const videoEl = document.getElementById('viewerVideo');
        const monitorEl = document.getElementById('tvMonitorBox');

        function showTemporaryNotice(msg, durationMs = 2200) {
            const box = document.getElementById('statusOverlay');
            const txt = document.getElementById('statusOverlayText');
            if (!box || !txt) return;
            txt.textContent = msg;
            box.classList.remove('hidden');
            clearTimeout(noticeTimeout);
            noticeTimeout = setTimeout(() => {
                box.classList.add('hidden');
            }, durationMs);
        }

        function updateMuteUi() {
            const icon = document.getElementById('muteIcon');
            const tapBtn = document.getElementById('btnTapForAudio');
            if (!videoEl) return;
            const isMuted = Boolean(videoEl.muted);
            if (icon) {
                icon.className = isMuted
                    ? 'fa-solid fa-volume-xmark text-red-400 text-sm'
                    : 'fa-solid fa-volume-high text-emerald-400 text-sm';
            }
            if (tapBtn) {
                tapBtn.classList.toggle('hidden', !isMuted || !currentStreamUrl);
            }
        }

        function toggleMute() {
            if (!videoEl) return;
            videoEl.muted = !videoEl.muted;
            if (!videoEl.muted) {
                videoEl.volume = 1;
                videoEl.play().catch(() => {});
            }
            updateMuteUi();
        }

        function enableAudioNow() {
            if (!videoEl) return;
            videoEl.muted = false;
            videoEl.volume = 1;
            videoEl.play().catch(() => {});
            updateMuteUi();
        }

        function isFullscreenNow() {
            return Boolean(document.fullscreenElement || document.webkitFullscreenElement || isCssFull);
        }

        function updateFullscreenUi() {
            const active = isFullscreenNow();
            const icon = document.getElementById('fsIcon');
            const label = document.getElementById('fsLabel');
            if (icon) icon.className = active ? 'fa-solid fa-compress text-white text-sm' : 'fa-solid fa-expand text-white text-sm';
            if (label) label.textContent = active ? 'Salir' : 'TV';
        }

        async function toggleTvFullscreen() {
            try {
                if (isFullscreenNow()) {
                    if (isCssFull) {
                        isCssFull = false;
                        monitorEl?.classList.remove('tv-expanded-fs');
                        document.body.style.overflow = '';
                    } else if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    updateFullscreenUi();
                    return;
                }
                if (monitorEl && monitorEl.requestFullscreen) {
                    await monitorEl.requestFullscreen();
                    updateFullscreenUi();
                    return;
                }
            } catch (e) {}

            isCssFull = true;
            monitorEl?.classList.add('tv-expanded-fs');
            document.body.style.overflow = 'hidden';
            updateFullscreenUi();
        }

        function classifyChannelCategory(item) {
            if (item && item.category === 'peliculas') return 'peliculas';
            if (item && item.category === 'tv') return 'tv';
            const url = String(item?.url || '').trim();
            return /\.(mp4|mkv|avi|webm|m4v)(\?|$)/i.test(url) ? 'peliculas' : 'tv';
        }

        function isHlsStream(url) {
            return /\.m3u8(\?|$)/i.test(String(url || '').trim());
        }

        function setChannelFilter(filterName) {
            currentFilter = filterName === 'peliculas' ? 'peliculas' : 'tv';
            ['tv', 'peliculas'].forEach((name) => {
                const btn = document.getElementById(`filter-${name}`);
                if (!btn) return;
                btn.className = name === currentFilter
                    ? (name === 'peliculas'
                        ? 'py-2 px-3 rounded-xl bg-violet-600 text-white text-xs font-black flex items-center justify-center gap-1.5 cursor-pointer transition shadow'
                        : 'py-2 px-3 rounded-xl bg-sky-600 text-white text-xs font-black flex items-center justify-center gap-1.5 cursor-pointer transition shadow')
                    : 'py-2 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-extrabold flex items-center justify-center gap-1.5 cursor-pointer transition';
            });
            renderLists();
        }

        function saveViewerChannels() {
            try {
                localStorage.setItem(VIEWER_STORAGE_KEY, JSON.stringify({
                    channels: channels.slice(0, 150),
                    activeUrl: currentStreamUrl || (channels[currentIdx]?.url || ''),
                    lastSignalTimestamp: lastAppliedSignalTimestamp
                }));
            } catch (e) {}
        }

        function loadViewerChannels() {
            try {
                const raw = localStorage.getItem(VIEWER_STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed && Array.isArray(parsed.channels) && parsed.channels.length > 0) {
                    channels = parsed.channels
                        .filter((c) => c && c.url)
                        .map((c) => ({
                            title: String(c.title || 'Canal 5'),
                            url: String(c.url).trim(),
                            category: classifyChannelCategory(c)
                        }));
                    lastAppliedSignalTimestamp = Number(parsed.lastSignalTimestamp || 0);
                    if (parsed.activeUrl) {
                        const found = channels.findIndex((c) => c.url === parsed.activeUrl);
                        if (found >= 0) currentIdx = found;
                    }
                }
            } catch (e) {}
        }

        function playChannelAt(index, userInitiated = false) {
            if (!channels.length) return;
            currentIdx = ((index % channels.length) + channels.length) % channels.length;
            const ch = channels[currentIdx];
            currentStreamUrl = ch.url;
            saveViewerChannels();

            const titleEl = document.getElementById('currentChannelTitle');
            const counterEl = document.getElementById('channelCounterText');
            if (titleEl) titleEl.textContent = ch.title || 'Canal 5 DNPlus TV';
            if (counterEl) counterEl.textContent = `${currentIdx + 1} / ${channels.length}`;

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (videoEl) {
                if (userInitiated) {
                    videoEl.muted = false;
                    videoEl.volume = 1;
                }
                updateMuteUi();

                const startPlayback = () => {
                    videoEl.play().catch(() => {
                        videoEl.muted = true;
                        updateMuteUi();
                        videoEl.play().catch(() => {});
                    });
                };

                if (isHlsStream(ch.url) || !/\.(mp4|webm|ogg|m4v)(\?|$)/i.test(ch.url)) {
                    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                        hlsInstance = new Hls({
                            enableWorker: true,
                            lowLatencyMode: false,
                            maxBufferLength: 30,
                            maxMaxBufferLength: 60,
                            backBufferLength: 30,
                            liveSyncDurationCount: 3,
                            liveMaxLatencyDurationCount: 10,
                            manifestLoadingMaxRetry: 6,
                            levelLoadingMaxRetry: 6,
                            fragLoadingMaxRetry: 8,
                            fragLoadingRetryDelay: 1000
                        });
                        hlsInstance.loadSource(ch.url);
                        hlsInstance.attachMedia(videoEl);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, startPlayback);
                        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
                            if (!data || !data.fatal) return;
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                hlsInstance.startLoad();
                                return;
                            }
                            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                hlsInstance.recoverMediaError();
                                return;
                            }
                            if (hlsInstance) {
                                hlsInstance.destroy();
                                hlsInstance = null;
                            }
                            showTemporaryNotice('Señal interrumpida. Toca otro ícono para cambiar.', 2600);
                        });
                    } else {
                        videoEl.src = ch.url;
                        videoEl.load();
                        startPlayback();
                    }
                } else {
                    videoEl.src = ch.url;
                    videoEl.load();
                    startPlayback();
                }
            }

            renderLists();
        }

        function playNextChannel(userInitiated = true) {
            if (!channels.length) return;
            playChannelAt((currentIdx + 1) % channels.length, userInitiated);
        }

        function scrollChannelsStrip(dir) {
            const strip = document.getElementById('viewerChannelIconsGrid');
            if (!strip) return;
            strip.scrollBy({ left: dir * 240, behavior: 'smooth' });
        }

        function renderLists() {
            const iconsGrid = document.getElementById('viewerChannelIconsGrid');
            const quickCount = document.getElementById('quickChannelsCount');
            const counterEl = document.getElementById('channelCounterText');

            const filteredEntries = channels
                .map((ch, idx) => ({ ch, idx }))
                .filter(({ ch }) => classifyChannelCategory(ch) === currentFilter);

            if (quickCount) {
                quickCount.textContent = currentFilter === 'peliculas'
                    ? `${filteredEntries.length} títulos`
                    : `${filteredEntries.length} canales`;
            }
            if (counterEl) {
                counterEl.textContent = channels.length > 0 ? `${currentIdx + 1} / ${channels.length}` : '0 / 0';
            }

            if (!iconsGrid) return;
            iconsGrid.innerHTML = '';

            if (!filteredEntries.length) {
                iconsGrid.innerHTML = `
                    <div class="w-full py-6 px-3 rounded-2xl border border-dashed border-slate-800 text-center text-xs text-slate-400">
                        ${currentFilter === 'peliculas' ? 'Aún no hay películas o series disponibles.' : 'Esperando canales en vivo...'}
                    </div>
                `;
                return;
            }

            const frag = document.createDocumentFragment();
            filteredEntries.forEach(({ ch, idx }) => {
                const isPlaying = idx === currentIdx && ch.url === currentStreamUrl;
                const isMovie = classifyChannelCategory(ch) === 'peliculas';
                const grad = isMovie ? 'from-violet-600 to-indigo-800' : 'from-sky-500 to-blue-700';
                const iconName = isMovie ? 'fa-film' : 'fa-tv';

                const cardBtn = document.createElement('button');
                cardBtn.type = 'button';
                cardBtn.onclick = () => playChannelAt(idx, true);
                cardBtn.className = `snap-start shrink-0 w-36 sm:w-44 p-2.5 rounded-2xl border text-left flex flex-col items-center justify-center gap-2 transition cursor-pointer ${
                    isPlaying
                        ? 'bg-sky-600/25 border-sky-400 text-white font-extrabold shadow-lg ring-1 ring-sky-400/50'
                        : 'bg-slate-950/90 border-slate-800 text-slate-200 hover:border-sky-500/60 hover:bg-slate-900'
                }`;
                cardBtn.innerHTML = `
                    <span class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 bg-gradient-to-br ${grad} text-white shadow-md">
                        <i class="fa-solid ${iconName} text-base"></i>
                    </span>
                    <div class="w-full text-center min-w-0">
                        <p class="text-[11px] font-extrabold truncate">${ch.title}</p>
                        <p class="text-[9px] uppercase tracking-wider mt-0.5 ${
                            isPlaying ? 'text-emerald-400 font-black' : (isMovie ? 'text-violet-400' : 'text-sky-400')
                        }">${isPlaying ? '● VIENDO' : (isMovie ? 'PELÍCULAS' : 'TV EN VIVO')}</p>
                    </div>
                `;
                frag.appendChild(cardBtn);
            });
            iconsGrid.appendChild(frag);
        }

        function applyIncomingSignal(payload) {
            if (!payload || typeof payload !== 'object') return;
            const msgTs = Number(payload.timestamp || 0);

            if (payload.clearAll === true) {
                clearedAtTimestamp = Math.max(clearedAtTimestamp, msgTs || Date.now());
                lastAppliedSignalTimestamp = clearedAtTimestamp;
                channels = [];
                currentIdx = 0;
                currentStreamUrl = '';
                try {
                    localStorage.removeItem(VIEWER_STORAGE_KEY);
                } catch (e) {}
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
                if (videoEl) {
                    videoEl.pause();
                    videoEl.removeAttribute('src');
                    videoEl.load();
                }
                const titleEl = document.getElementById('currentChannelTitle');
                if (titleEl) titleEl.textContent = 'Esperando señal del canal...';
                renderLists();
                return;
            }

            if (clearedAtTimestamp > 0 && msgTs > 0 && msgTs <= clearedAtTimestamp) return;
            if (msgTs > 0 && lastAppliedSignalTimestamp > 0 && msgTs < lastAppliedSignalTimestamp && channels.length > 0) {
                return;
            }
            if (msgTs > lastAppliedSignalTimestamp) {
                lastAppliedSignalTimestamp = msgTs;
            }

            const incomingUrl = String(payload.url || payload.streamUrl || '').trim();
            const incomingTitle = String(payload.title || '').trim();
            let updated = false;

            if (Array.isArray(payload.playlist) && payload.playlist.length > 0) {
                const normalized = payload.playlist
                    .filter((item) => item && item.url)
                    .map((item) => ({
                        title: String(item.title || 'Canal 5'),
                        url: String(item.url).trim(),
                        category: classifyChannelCategory(item)
                    }));
                const prevSig = channels.map((c) => `${c.title}|${c.url}|${c.category}`).join(';;');
                const nextSig = normalized.map((c) => `${c.title}|${c.url}|${c.category}`).join(';;');
                if (normalized.length > 0 && prevSig !== nextSig) {
                    channels = normalized;
                    const keptIdx = currentStreamUrl ? channels.findIndex((c) => c.url === currentStreamUrl) : -1;
                    currentIdx = keptIdx >= 0 ? keptIdx : 0;
                    updated = true;
                    saveViewerChannels();
                    renderLists();
                }
            }

            if (incomingUrl) {
                let idx = channels.findIndex((c) => c.url === incomingUrl);
                if (idx < 0) {
                    channels.push({
                        title: incomingTitle || 'Canal 5 DNPlus TV',
                        url: incomingUrl,
                        category: classifyChannelCategory({ title: incomingTitle, url: incomingUrl, category: payload.category })
                    });
                    idx = channels.length - 1;
                    updated = true;
                    saveViewerChannels();
                    renderLists();
                }
                if (!currentStreamUrl && channels.length > 0) {
                    playChannelAt(idx, false);
                }
            } else if (updated && channels.length > 0 && !currentStreamUrl) {
                playChannelAt(0, false);
            }

            const syncEl = document.getElementById('syncStatusText');
            if (syncEl && channels.length > 0) {
                syncEl.textContent = `Señal Activa • ${channels.length} disponibles`;
                syncEl.className = 'text-[11px] text-emerald-400 font-semibold truncate';
            }
        }

        function initMqttSync() {
            if (typeof mqtt === 'undefined') return;
            activeMqttClients.forEach((c) => {
                try { c.end(true); } catch (e) {}
            });
            activeMqttClients.length = 0;

            MQTT_BROKERS.forEach((brokerUrl, i) => {
                try {
                    const client = mqtt.connect(brokerUrl, {
                        clientId: `dnplus_viewer_${i}_${Math.random().toString(16).slice(2, 8)}`,
                        reconnectPeriod: 3500,
                        connectTimeout: 7000
                    });
                    activeMqttClients.push(client);
                    client.on('connect', () => {
                        MQTT_TOPICS.forEach((topic) => {
                            try { client.subscribe(topic, { qos: 1 }); } catch (e) {}
                        });
                    });
                    client.on('message', (_, message) => {
                        try {
                            const rawStr = message.toString();
                            if (rawStr) applyIncomingSignal(JSON.parse(rawStr));
                        } catch (e) {}
                    });
                } catch (e) {}
            });
        }

        function refreshChannelsFromPanel() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('fa-spin');
            showTemporaryNotice('Actualizando canales...', 1600);
            try {
                const savedSignal = localStorage.getItem('dnplus_live_signal');
                if (savedSignal) applyIncomingSignal(JSON.parse(savedSignal));
            } catch (e) {}
            initMqttSync();
            setTimeout(() => {
                if (icon) icon.classList.remove('fa-spin');
            }, 900);
        }

        if (videoEl) {
            videoEl.addEventListener('volumechange', updateMuteUi);
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'dnplus_live_signal' && e.newValue) {
                try { applyIncomingSignal(JSON.parse(e.newValue)); } catch (err) {}
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadViewerChannels();
            renderLists();
            if (channels.length > 0) {
                playChannelAt(currentIdx, false);
            }
            initMqttSync();
            try {
                const savedSignal = localStorage.getItem('dnplus_live_signal');
                if (savedSignal) applyIncomingSignal(JSON.parse(savedSignal));
            } catch (e) {}
        });
    </script>
</body>
</html>
